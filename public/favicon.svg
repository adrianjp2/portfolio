<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Core & Bus Glowing Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Accent Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.5)" />
      <stop offset="100%" stop-color="rgba(249, 115, 22, 0.2)" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ec4899" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Architecture Traces / Circuit Paths -->
  <g stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Orthogonal Bus Traces to Corner Nodes -->
    <path d="M 25 25 L 18 25 L 18 19" />
    <path d="M 39 25 L 46 25 L 46 19" />
    <path d="M 25 39 L 18 39 L 18 45" />
    <path d="M 39 39 L 46 39 L 46 45" />

    <!-- Cardinal Bus Traces -->
    <line x1="32" y1="24" x2="32" y2="14" />
    <line x1="32" y1="40" x2="32" y2="50" />
    <line x1="24" y1="32" x2="14" y2="32" />
    <line x1="40" y1="32" x2="50" y2="32" />
  </g>

  <!-- Corner Architecture Nodes -->
  <circle cx="18" cy="19" r="3" fill="#ec4899" />
  <circle cx="46" cy="19" r="3" fill="#f97316" />
  <circle cx="18" cy="45" r="3" fill="#ec4899" />
  <circle cx="46" cy="45" r="3" fill="#14b8a6" />

  <!-- Cardinal Edge Nodes -->
  <circle cx="32" cy="14" r="2.2" fill="#f97316" />
  <circle cx="32" cy="50" r="2.2" fill="#ec4899" />
  <circle cx="14" cy="32" r="2.2" fill="#ec4899" />
  <circle cx="50" cy="32" r="2.2" fill="#14b8a6" />

  <!-- Central Processing Core / Architecture Engine -->
  <rect x="24.5" y="24.5" width="15" height="15" rx="4" fill="url(#brandGrad)" filter="url(#coreGlow)" />
  <!-- Inner Neural Core / Spark -->
  <rect x="29" y="29" width="6" height="6" rx="1.5" fill="#ffffff" />
</svg>
